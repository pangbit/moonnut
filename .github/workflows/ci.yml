name: ci
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  native:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential libssl-dev zlib1g-dev libnss3-tools \
            nut-server=2.8.4+really-2 nut-client=2.8.4+really-2 \
            libupsclient7=2.8.4+really-2 libupsclient-dev=2.8.4+really-2 libnutscan4=2.8.4+really-2
          dpkg-query -W nut-server nut-client libupsclient7 libupsclient-dev libnutscan4
          uname -sm
          sha256sum /usr/bin/upsc /usr/bin/upsrw /usr/bin/upscmd
          ldd /usr/bin/upsc
      - name: Fetch pinned external PyNUT reference
        run: |
          mkdir -p "$RUNNER_TEMP/moonnut-reference"
          curl -fsSL --retry 2 \
            https://raw.githubusercontent.com/networkupstools/nut/541c2ecf0b2ec33dadb9f40b16acbe39042bd103/scripts/python/module/PyNUT.py.in \
            -o "$RUNNER_TEMP/moonnut-reference/PyNUT.py"
          echo "a12d1e40f8cd926314157c137372628322dd09db94d697aca4bc9dc8beb64f82  $RUNNER_TEMP/moonnut-reference/PyNUT.py" | sha256sum --check
      - name: Install verified MoonBit version
        run: curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash -s -- '0.10.20+65efd5b93'
      - name: Set toolchain path
        run: echo "$HOME/.moon/bin" >> "$GITHUB_PATH"
      - name: Check and test
        run: |
          moon version
          moon update
          moon check --target native
          moon test --target native
          moon build --target native
          python3 scripts/tls_smoke.py
          python3 scripts/cli_json_smoke.py
          cc -Wall -Wextra -Werror scripts/nut_reference.c -lupsclient -o "$RUNNER_TEMP/moonnut-reference/nut-reference"
          cc -Wall -Wextra -Werror scripts/nut_session_reference.c -lupsclient -o "$RUNNER_TEMP/moonnut-reference/nut-session-reference"
          python3 scripts/upsd_integration.py --pynut "$RUNNER_TEMP/moonnut-reference/PyNUT.py" --nut-reference "$RUNNER_TEMP/moonnut-reference/nut-reference" --session-reference "$RUNNER_TEMP/moonnut-reference/nut-session-reference"
          cc -Wall -Wextra -Werror scripts/nut_control_reference.c -lupsclient -o "$RUNNER_TEMP/moonnut-reference/nut-control-reference"
          python3 scripts/control_integration.py --reference "$RUNNER_TEMP/moonnut-reference/nut-control-reference" --evidence-dir "$RUNNER_TEMP/moonnut-control-evidence"
          python3 scripts/admin_cli_integration.py --evidence-dir "$RUNNER_TEMP/moonnut-control-evidence"
          moon info --target native
          moon fmt --check
          git diff --exit-code -- '*.mbti' '*.mbt' moon.mod moon.pkg
      - name: Save isolated control evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: isolated-control-evidence
          path: ${{ runner.temp }}/moonnut-control-evidence
          if-no-files-found: ignore
          retention-days: 7
